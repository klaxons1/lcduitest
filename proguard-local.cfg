# Local ProGuard config - only library jars, NO injars/outjars
# IntelliJ will add -injars and -outjars via command line, so don't duplicate here

# Adjust these paths to your J2ME SDK / WTK / MicroEmulator jars
# Example for IntelliJ J2ME SDK:
# -libraryjars "C:/Users/pashansky2005/.m2/repository/net/sf/microemulator/midpapi20/2.0.4/midpapi20-2.0.4.jar"
# -libraryjars "C:/Users/pashansky2005/.m2/repository/net/sf/microemulator/cldcapi11/2.0.4/cldcapi11-2.0.4.jar"

# If you have M3G API jar (m3g.jar or jsr184.jar), add it:
# -libraryjars "C:/path/to/m3g.jar"

# Fallback - try to find jars via IDEA JDK
# -libraryjars <java.home>/lib/rt.jar

-dontwarn
-dontnote
