# ProGuard config for M3G Tester
# This file is included via @proguard.cfg, the -injars/-outjars are supplied by IntelliJ via command line
# So do NOT put -injars or -outjars here, only -libraryjars and keep rules

-dontoptimize
-dontshrink
-dontobfuscate
-dontwarn
-dontnote

# Keep all classes and members (no obfuscation for MIDlet)
-keep class * {
    *;
}

# Keep MIDlet entry points
-keep class lcduitester { *; }
-keep class m3gtester { *; }
-keep class m3gtest.** { *; }

# Library jars will be supplied via proguard-local.cfg
# Example:
# -libraryjars /path/to/cldcapi11.jar
# -libraryjars /path/to/midpapi20.jar
# -libraryjars /path/to/m3g.jar
